<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Gradiente de Fondo Neón Hitster -->
    <radialGradient id="hitsterGlow" cx="65%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="75%" stop-color="#06b6d4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0b1326" stop-opacity="0"/>
    </radialGradient>

    <!-- Resplandor del Vinilo -->
    <radialGradient id="vinylGlow" cx="60%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0b1326" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente del Disco de Vinilo -->
    <linearGradient id="vinylBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#18181b" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Gradiente de la Etiqueta Central del Vinilo -->
    <radialGradient id="vinylLabel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#8b5cf6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0.85"/>
    </radialGradient>

    <!-- Gradientes de Neón para Ondas y Luces -->
    <linearGradient id="neonPinkCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Atmósfera Neón de Fiesta Musical -->
  <rect width="600" height="600" fill="url(#hitsterGlow)"/>
  <circle cx="420" cy="220" r="230" fill="url(#vinylGlow)"/>

  <!-- Ondas Sonoras y Ecualizador Circulares de Fondo -->
  <g opacity="0.22" stroke="#06b6d4" stroke-width="2" fill="none">
    <circle cx="410" cy="230" r="215" stroke-dasharray="16,8"/>
    <circle cx="410" cy="230" r="185"/>
    <circle cx="410" cy="230" r="150" stroke-dasharray="8,6"/>
    <circle cx="410" cy="230" r="120" stroke-dasharray="4,4"/>
  </g>

  <!-- Disco de Vinilo Central (LP) -->
  <g transform="translate(410, 230)">
    <!-- Cuerpo del Vinilo -->
    <circle cx="0" cy="0" r="145" fill="url(#vinylBody)" stroke="#ec4899" stroke-width="3" opacity="0.85"/>

    <!-- Ranuras y Surcos del Vinilo (Grooves) -->
    <circle cx="0" cy="0" r="135" fill="none" stroke="#8b5cf6" stroke-width="1.2" opacity="0.35"/>
    <circle cx="0" cy="0" r="125" fill="none" stroke="#ec4899" stroke-width="1.5" opacity="0.25"/>
    <circle cx="0" cy="0" r="115" fill="none" stroke="#06b6d4" stroke-width="1.2" opacity="0.35"/>
    <circle cx="0" cy="0" r="105" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.25"/>
    <circle cx="0" cy="0" r="95" fill="none" stroke="#ec4899" stroke-width="1.2" opacity="0.3"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.2"/>
    <circle cx="0" cy="0" r="75" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.3"/>
    <circle cx="0" cy="0" r="65" fill="none" stroke="#ec4899" stroke-width="1" opacity="0.25"/>

    <!-- Reflejos de Luz en el Vinilo (Shine sheen) -->
    <path d="M -135,-35 Q -80,-80 -35,-135 L -15,-120 Q -55,-70 -105,-15 Z" fill="#ec4899" opacity="0.18"/>
    <path d="M 35,135 Q 80,80 135,35 L 120,15 Q 70,55 15,105 Z" fill="#06b6d4" opacity="0.18"/>

    <!-- Etiqueta Central del Disco (Center Label) -->
    <circle cx="0" cy="0" r="50" fill="url(#vinylLabel)" stroke="#f43f5e" stroke-width="2"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#fbcfe8" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>

    <!-- Agujero Central del Eje -->
    <circle cx="0" cy="0" r="8" fill="#090d16" stroke="#fb7185" stroke-width="2"/>

    <!-- Icono de Música / Estrella en la Etiqueta -->
    <path d="M -12,-8 L -12,12 A 4,4 0 1,0 -8,15 L -8,-2 L 10,-6 L 10,8 A 4,4 0 1,0 14,11 L 14,-14 Z" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Brazo Mecánico del Tocadiscos (Tonearm) -->
  <g opacity="0.75" stroke="#f43f5e" stroke-linecap="round" stroke-linejoin="round">
    <!-- Base del Brazo -->
    <circle cx="560" cy="110" r="14" fill="#1e1b4b" stroke="#ec4899" stroke-width="3"/>
    <circle cx="560" cy="110" r="6" fill="#ec4899"/>

    <!-- Brazo Metálico en Ángulo -->
    <path d="M 550,115 L 485,165 L 440,215" fill="none" stroke="#06b6d4" stroke-width="4"/>

    <!-- Cabezal y Aguja sobre el Vinilo -->
    <rect x="428" y="212" width="16" height="10" rx="3" transform="rotate(-35 436 217)" fill="#ec4899" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="432" y1="223" x2="426" y2="231" stroke="#fde047" stroke-width="2"/>
  </g>

  <!-- Ecualizador Gráfico de Barras (Sound Spectrum Waves) -->
  <g transform="translate(140, 390)" opacity="0.55">
    <!-- Barras de Neón con degradado -->
    <rect x="0" y="45" width="8" height="45" rx="4" fill="url(#neonPinkCyan)"/>
    <rect x="14" y="25" width="8" height="65" rx="4" fill="url(#neonPinkCyan)"/>
    <rect x="28" y="10" width="8" height="80" rx="4" fill="url(#neonPinkCyan)"/>
    <rect x="42" y="35" width="8" height="55" rx="4" fill="url(#neonPinkCyan)"/>
    <rect x="56" y="5" width="8" height="85" rx="4" fill="url(#neonPinkCyan)"/>
    <rect x="70" y="20" width="8" height="70" rx="4" fill="url(#neonPinkCyan)"/>
    <rect x="84" y="40" width="8" height="50" rx="4" fill="url(#neonPinkCyan)"/>
    <rect x="98" y="15" width="8" height="75" rx="4" fill="url(#neonPinkCyan)"/>
    <rect x="112" y="0" width="8" height="90" rx="4" fill="url(#neonPinkCyan)"/>
    <rect x="126" y="30" width="8" height="60" rx="4" fill="url(#neonPinkCyan)"/>
    <rect x="140" y="12" width="8" height="78" rx="4" fill="url(#neonPinkCyan)"/>
    <rect x="154" y="48" width="8" height="42" rx="4" fill="url(#neonPinkCyan)"/>
    <rect x="168" y="22" width="8" height="68" rx="4" fill="url(#neonPinkCyan)"/>
    <rect x="182" y="8" width="8" height="82" rx="4" fill="url(#neonPinkCyan)"/>
    <rect x="196" y="38" width="8" height="52" rx="4" fill="url(#neonPinkCyan)"/>
    <rect x="210" y="18" width="8" height="72" rx="4" fill="url(#neonPinkCyan)"/>
    <rect x="224" y="50" width="8" height="40" rx="4" fill="url(#neonPinkCyan)"/>
    <rect x="238" y="28" width="8" height="62" rx="4" fill="url(#neonPinkCyan)"/>
    <rect x="252" y="14" width="8" height="76" rx="4" fill="url(#neonPinkCyan)"/>
    <rect x="266" y="36" width="8" height="54" rx="4" fill="url(#neonPinkCyan)"/>
  </g>

  <!-- Fichas Hitster Flotantes (Hitster Tokens) -->
  <g transform="translate(180, 160)" opacity="0.7">
    <!-- Ficha 1 -->
    <circle cx="0" cy="0" r="28" fill="#ec4899" stroke="#fbcfe8" stroke-width="2.5" filter="drop-shadow(0 4px 12px rgba(236,72,153,0.4))"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="0" y="8" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle">H</text>

    <!-- Ficha 2 -->
    <circle cx="55" cy="45" r="24" fill="#8b5cf6" stroke="#ddd6fe" stroke-width="2"/>
    <circle cx="55" cy="45" r="18" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="55" y="52" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle">H</text>

    <!-- Ficha 3 -->
    <circle cx="20" cy="85" r="20" fill="#06b6d4" stroke="#cffafe" stroke-width="2"/>
    <text x="20" y="91" font-family="system-ui, sans-serif" font-weight="900" font-size="15" fill="#ffffff" text-anchor="middle">H</text>
  </g>

  <!-- Notas Musicales y Brillos Neón Flotantes -->
  <g fill="#ec4899" opacity="0.6">
    <!-- Corchea 1 -->
    <path d="M 280,90 C 280,75 305,65 315,60 L 315,95 C 315,98 310,102 302,102 C 295,102 290,97 290,92 C 290,87 296,83 303,83 L 305,83 L 305,72 C 298,75 288,80 288,90 Z"/>
    <!-- Doble Corchea -->
    <path d="M 120,270 L 155,258 L 155,275 C 155,280 148,284 140,284 C 132,284 126,279 126,274 C 126,269 132,265 140,265 L 144,265 L 144,262 L 120,271 L 120,290 C 120,295 113,299 105,299 C 97,299 91,294 91,289 C 91,284 97,280 105,280 L 109,280 L 109,275 Z" fill="#06b6d4"/>
    <!-- Destellos Estelares Neón -->
    <path d="M 260,190 Q 270,190 270,180 Q 270,190 280,190 Q 270,190 270,200 Q 270,190 260,190 Z" fill="#ffffff" opacity="0.8"/>
    <path d="M 490,360 Q 498,360 498,352 Q 498,360 506,360 Q 498,360 498,368 Q 498,360 490,360 Z" fill="#fde047" opacity="0.8"/>
    <path d="M 360,420 Q 366,420 366,414 Q 366,420 372,420 Q 366,420 366,426 Q 366,420 360,420 Z" fill="#ec4899" opacity="0.9"/>
  </g>

  <!-- Línea de Tiempo Musical Graduada en la Parte Inferior -->
  <g transform="translate(60, 520)" opacity="0.45" stroke="#8b5cf6" stroke-width="2">
    <line x1="0" y1="0" x2="480" y2="0" stroke-dasharray="4,4"/>
    <circle cx="40" cy="0" r="5" fill="#ec4899" stroke="#ffffff"/>
    <circle cx="120" cy="0" r="5" fill="#8b5cf6" stroke="#ffffff"/>
    <circle cx="200" cy="0" r="6" fill="#06b6d4" stroke="#ffffff"/>
    <circle cx="280" cy="0" r="5" fill="#ec4899" stroke="#ffffff"/>
    <circle cx="360" cy="0" r="5" fill="#8b5cf6" stroke="#ffffff"/>
    <circle cx="440" cy="0" r="7" fill="#fde047" stroke="#ffffff"/>
  </g>
</svg>
