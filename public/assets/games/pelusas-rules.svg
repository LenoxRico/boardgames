<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="prBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1326"/>
      <stop offset="50%" stop-color="#2a0d1e"/>
      <stop offset="100%" stop-color="#0b1326"/>
    </linearGradient>

    <radialGradient id="prPinkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#fbbf24" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0b1326" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradientes de Pelusas Coloridas -->
    <radialGradient id="pPelusaPink" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="45%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#881337"/>
    </radialGradient>

    <radialGradient id="pPelusaTeal" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="45%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#164e63"/>
    </radialGradient>

    <radialGradient id="pPelusaGold" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>

    <radialGradient id="pPelusaPurple" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="45%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </radialGradient>

    <!-- Gradiente de la Aspiradora de Peligro -->
    <linearGradient id="pVacuum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Fondo Card Panorámico -->
  <rect width="800" height="400" rx="16" fill="url(#prBg)"/>
  <rect width="800" height="400" rx="16" fill="url(#prPinkGlow)"/>

  <!-- Remolino de Polvo y Destellos (Dust Swirl) -->
  <g opacity="0.3" stroke="#f43f5e" stroke-width="2" fill="none">
    <path d="M 120,320 Q 250,280 400,340 T 680,310" stroke-width="3" stroke-dasharray="10,6"/>
    <path d="M 150,350 Q 300,300 450,360 T 720,330" stroke-width="2"/>
    <circle cx="180" cy="120" r="3" fill="#fde047"/>
    <circle cx="280" cy="90" r="4" fill="#67e8f9"/>
    <circle cx="620" cy="110" r="5" fill="#f43f5e"/>
    <circle cx="680" cy="140" r="3" fill="#fde047"/>
  </g>

  <!-- Tubo de la Aspiradora Amenazante en el Fondo Superior -->
  <g transform="translate(680, 70) rotate(-25)" opacity="0.75">
    <path d="M -30,-80 L 30,-80 L 25,60 L 50,100 L -50,100 L -25,60 Z" fill="url(#pVacuum)" stroke="#94a3b8" stroke-width="2.5"/>
    <ellipse cx="0" cy="100" rx="50" ry="15" fill="#ef4444" stroke="#fca5a5" stroke-width="2"/>
    <!-- Vórtice de Succión -->
    <path d="M -30,115 Q 0,140 30,115" stroke="#ef4444" stroke-width="2" fill="none" stroke-dasharray="4,4"/>
  </g>

  <!-- Cartas con Números (1 a 10) que Coleccionan las Pelusas -->
  <!-- Carta 4 (Izquierda) -->
  <g transform="translate(160, 240) rotate(-14)">
    <rect x="-35" y="-55" width="70" height="110" rx="8" fill="#180b29" stroke="#06b6d4" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="22" fill="#06b6d4" opacity="0.3"/>
    <text x="0" y="9" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="28" font-weight="900" text-anchor="middle">4</text>
  </g>

  <!-- Carta 7 (Derecha) -->
  <g transform="translate(640, 240) rotate(14)">
    <rect x="-35" y="-55" width="70" height="110" rx="8" fill="#180b29" stroke="#a855f7" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="22" fill="#a855f7" opacity="0.3"/>
    <text x="0" y="9" fill="#c084fc" font-family="system-ui, sans-serif" font-size="28" font-weight="900" text-anchor="middle">7</text>
  </g>

  <!-- El Cuarteto de Pelusas Traviesas en el Escenario Central -->

  <!-- Pelusa 1: Cyan Traviesa (Izquierda Media) -->
  <g transform="translate(260, 230)">
    <!-- Pelos de la Pelusa -->
    <g fill="url(#pPelusaTeal)" stroke="#22d3ee" stroke-width="2">
      <circle cx="-35" cy="-20" r="18"/>
      <circle cx="35" cy="-20" r="18"/>
      <circle cx="-42" cy="15" r="16"/>
      <circle cx="42" cy="15" r="16"/>
      <circle cx="0" cy="-40" r="20"/>
      <circle cx="0" cy="0" r="48"/>
    </g>
    <!-- Ojos Saltones Picaronas -->
    <circle cx="-16" cy="-8" r="13" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
    <circle cx="16" cy="-8" r="13" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
    <circle cx="-12" cy="-6" r="6" fill="#0f172a"/>
    <circle cx="20" cy="-6" r="6" fill="#0f172a"/>
    <circle cx="-10" cy="-8" r="2.5" fill="#ffffff"/>
    <circle cx="22" cy="-8" r="2.5" fill="#ffffff"/>
    <!-- Sonrisa Pícara -->
    <path d="M -12,18 Q 0,30 18,18" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Pelusa 2: Púrpura Curiosa (Derecha Media) -->
  <g transform="translate(540, 230)">
    <g fill="url(#pPelusaPurple)" stroke="#c084fc" stroke-width="2">
      <circle cx="-35" cy="-20" r="18"/>
      <circle cx="35" cy="-20" r="18"/>
      <circle cx="-40" cy="18" r="16"/>
      <circle cx="40" cy="18" r="16"/>
      <circle cx="0" cy="-38" r="20"/>
      <circle cx="0" cy="0" r="46"/>
    </g>
    <!-- Ojos Grandes Curiosos -->
    <circle cx="-14" cy="-8" r="14" fill="#ffffff" stroke="#7e22ce" stroke-width="2"/>
    <circle cx="16" cy="-8" r="14" fill="#ffffff" stroke="#7e22ce" stroke-width="2"/>
    <circle cx="-18" cy="-8" r="7" fill="#0f172a"/>
    <circle cx="12" cy="-8" r="7" fill="#0f172a"/>
    <circle cx="-20" cy="-10" r="3" fill="#ffffff"/>
    <circle cx="10" cy="-10" r="3" fill="#ffffff"/>
    <!-- Boquita Abierta Sorprendida -->
    <ellipse cx="0" cy="20" rx="8" ry="10" fill="#0f172a"/>
  </g>

  <!-- Pelusa 3: Gran Pelusa Rosa Reina (Centro) -->
  <g transform="translate(400, 190)">
    <!-- Pelaje Exuberante de Bolitas -->
    <g fill="url(#pPelusaPink)" stroke="#fb7185" stroke-width="2.5">
      <circle cx="-50" cy="-30" r="22"/>
      <circle cx="50" cy="-30" r="22"/>
      <circle cx="-55" cy="25" r="22"/>
      <circle cx="55" cy="25" r="22"/>
      <circle cx="0" cy="-55" r="26"/>
      <circle cx="-25" cy="-50" r="22"/>
      <circle cx="25" cy="-50" r="22"/>
      <circle cx="0" cy="0" r="62"/>
    </g>
    <!-- Corona Dorada Pequeña en la Pelusa Rosa -->
    <path d="M -25,-65 L -15,-85 L 0,-70 L 15,-85 L 25,-65 Z" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
    <circle cx="0" cy="-70" r="3" fill="#ef4444"/>

    <!-- Ojazos Expresivos Alegres -->
    <circle cx="-20" cy="-10" r="17" fill="#ffffff" stroke="#be123c" stroke-width="2"/>
    <circle cx="20" cy="-10" r="17" fill="#ffffff" stroke="#be123c" stroke-width="2"/>
    <circle cx="-16" cy="-8" r="8" fill="#0f172a"/>
    <circle cx="24" cy="-8" r="8" fill="#0f172a"/>
    <circle cx="-13" cy="-11" r="3.5" fill="#ffffff"/>
    <circle cx="27" cy="-11" r="3.5" fill="#ffffff"/>
    <!-- Lengua Afuera Traviesa -->
    <path d="M -16,20 Q 0,36 16,20" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -8,27 C -8,38 8,38 8,27 Z" fill="#f43f5e"/>
  </g>

  <!-- Pelusa 4: Amarilla Chiquita (Frente Centro) -->
  <g transform="translate(400, 290)">
    <g fill="url(#pPelusaGold)" stroke="#fde047" stroke-width="2">
      <circle cx="-25" cy="-15" r="14"/>
      <circle cx="25" cy="-15" r="14"/>
      <circle cx="0" cy="-28" r="15"/>
      <circle cx="0" cy="0" r="32"/>
    </g>
    <!-- Ojos Felices -->
    <path d="M -16,-4 Q -10,-14 -4,-4" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 4,-4 Q 10,-14 16,-4" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M -8,10 Q 0,18 8,10" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
