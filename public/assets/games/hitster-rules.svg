<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="hrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1326"/>
      <stop offset="50%" stop-color="#1e1035"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <radialGradient id="hrNeonCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="hrCassette" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d124d"/>
      <stop offset="50%" stop-color="#180b29"/>
      <stop offset="100%" stop-color="#0f051d"/>
    </linearGradient>

    <linearGradient id="hrNeonBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="35%" stop-color="#f43f5e"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="hrCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <filter id="hrGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo Card Panorámico -->
  <rect width="800" height="400" rx="16" fill="url(#hrBg)"/>
  <rect width="800" height="400" rx="16" fill="url(#hrNeonCenter)"/>

  <!-- Línea de Tiempo Musical (Timeline) -->
  <g stroke="#8b5cf6" stroke-width="2" stroke-dasharray="8,6" opacity="0.4">
    <line x1="60" y1="330" x2="740" y2="330"/>
    <circle cx="100" cy="330" r="4" fill="#06b6d4"/>
    <circle cx="250" cy="330" r="4" fill="#a855f7"/>
    <circle cx="400" cy="330" r="6" fill="#ec4899"/>
    <circle cx="550" cy="330" r="4" fill="#a855f7"/>
    <circle cx="700" cy="330" r="4" fill="#06b6d4"/>
  </g>

  <!-- Tarjetas Cronológicas de la Línea de Tiempo Flotando -->
  <!-- Carta 1: 1975 -->
  <g transform="translate(100, 240) rotate(-12)" filter="url(#hrGlow)">
    <rect x="-35" y="-50" width="70" height="100" rx="8" fill="url(#hrCardGrad)" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="0" cy="-20" r="14" fill="#06b6d4" opacity="0.4"/>
    <text x="0" y="-15" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle">1975</text>
    <rect x="-22" y="5" width="44" height="4" rx="2" fill="#06b6d4" opacity="0.6"/>
    <rect x="-16" y="15" width="32" height="3" rx="1.5" fill="#94a3b8" opacity="0.5"/>
  </g>

  <!-- Carta 2: 1999 -->
  <g transform="translate(240, 220) rotate(-4)">
    <rect x="-35" y="-50" width="70" height="100" rx="8" fill="url(#hrCardGrad)" stroke="#a855f7" stroke-width="2"/>
    <circle cx="0" cy="-20" r="14" fill="#a855f7" opacity="0.4"/>
    <text x="0" y="-15" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle">1999</text>
    <rect x="-22" y="5" width="44" height="4" rx="2" fill="#a855f7" opacity="0.6"/>
    <rect x="-16" y="15" width="32" height="3" rx="1.5" fill="#94a3b8" opacity="0.5"/>
  </g>

  <!-- Carta 3: 2012 -->
  <g transform="translate(560, 220) rotate(5)">
    <rect x="-35" y="-50" width="70" height="100" rx="8" fill="url(#hrCardGrad)" stroke="#ec4899" stroke-width="2"/>
    <circle cx="0" cy="-20" r="14" fill="#ec4899" opacity="0.4"/>
    <text x="0" y="-15" fill="#f472b6" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle">2012</text>
    <rect x="-22" y="5" width="44" height="4" rx="2" fill="#ec4899" opacity="0.6"/>
    <rect x="-16" y="15" width="32" height="3" rx="1.5" fill="#94a3b8" opacity="0.5"/>
  </g>

  <!-- Carta 4: 2024 -->
  <g transform="translate(700, 240) rotate(14)" filter="url(#hrGlow)">
    <rect x="-35" y="-50" width="70" height="100" rx="8" fill="url(#hrCardGrad)" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="0" cy="-20" r="14" fill="#06b6d4" opacity="0.4"/>
    <text x="0" y="-15" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle">2024</text>
    <rect x="-22" y="5" width="44" height="4" rx="2" fill="#06b6d4" opacity="0.6"/>
    <rect x="-16" y="15" width="32" height="3" rx="1.5" fill="#94a3b8" opacity="0.5"/>
  </g>

  <!-- Boombox Cassette Central Monumental -->
  <g transform="translate(400, 150)">
    <!-- Cuerpo del Cassette Retro -->
    <rect x="-140" y="-85" width="280" height="170" rx="18" fill="url(#hrCassette)" stroke="url(#hrNeonBar)" stroke-width="3.5" filter="url(#hrGlow)"/>

    <!-- Etiqueta de la Cinta de Audio -->
    <path d="M -115,-65 L 115,-65 C 122,-65 125,-60 125,-50 L 125,25 C 125,35 120,40 110,40 L 70,40 L 50,60 L -50,60 L -70,40 L -110,40 C -120,40 -125,35 -125,25 L -125,-50 C -125,-60 -122,-65 -115,-65 Z"
          fill="#180b29" stroke="#8b5cf6" stroke-width="2"/>

    <!-- Franja Neón Hitster en el Cassette -->
    <rect x="-110" y="-55" width="220" height="24" rx="4" fill="url(#hrNeonBar)"/>
    <text x="0" y="-38" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="900" letter-spacing="4" text-anchor="middle">HITSTER MUSIC</text>

    <!-- Ventana de los Rodillos de la Cinta -->
    <rect x="-65" y="-15" width="130" height="44" rx="8" fill="#090414" stroke="#ec4899" stroke-width="2"/>

    <!-- Carrete Izquierdo -->
    <circle cx="-35" cy="7" r="16" fill="#1e1035" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="-35" cy="7" r="6" fill="#ffffff"/>
    <path d="M -35,-3 L -35,17 M -45,7 L -25,7" stroke="#06b6d4" stroke-width="2.5"/>

    <!-- Cinta Magnética Conectora -->
    <line x1="-19" y1="7" x2="19" y2="7" stroke="#ec4899" stroke-width="4"/>

    <!-- Carrete Derecho -->
    <circle cx="35" cy="7" r="16" fill="#1e1035" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="35" cy="7" r="6" fill="#ffffff"/>
    <path d="M 35,-3 L 35,17 M 25,7 L 45,7" stroke="#06b6d4" stroke-width="2.5"/>
  </g>

  <!-- Ondas de Ecualizador Neón Flotantes Superiores -->
  <g transform="translate(400, 320)" opacity="0.85">
    <!-- Barras de Espectro Neón -->
    <rect x="-90" y="-15" width="6" height="30" rx="3" fill="#06b6d4"/>
    <rect x="-75" y="-25" width="6" height="50" rx="3" fill="#06b6d4"/>
    <rect x="-60" y="-35" width="6" height="70" rx="3" fill="#a855f7"/>
    <rect x="-45" y="-20" width="6" height="40" rx="3" fill="#a855f7"/>
    <rect x="-30" y="-45" width="6" height="90" rx="3" fill="#ec4899"/>
    <rect x="-15" y="-30" width="6" height="60" rx="3" fill="#ec4899"/>
    <rect x="0" y="-50" width="6" height="100" rx="3" fill="#f43f5e"/>
    <rect x="15" y="-30" width="6" height="60" rx="3" fill="#ec4899"/>
    <rect x="30" y="-45" width="6" height="90" rx="3" fill="#ec4899"/>
    <rect x="45" y="-20" width="6" height="40" rx="3" fill="#a855f7"/>
    <rect x="60" y="-35" width="6" height="70" rx="3" fill="#a855f7"/>
    <rect x="75" y="-25" width="6" height="50" rx="3" fill="#06b6d4"/>
    <rect x="90" y="-15" width="6" height="30" rx="3" fill="#06b6d4"/>
  </g>

  <!-- Notas Musicales y Destellos Neón -->
  <g fill="#ec4899" opacity="0.9">
    <!-- Nota 1 -->
    <path d="M 190,70 C 190,60 200,50 215,50 L 225,50 L 225,85 C 220,80 210,80 205,85 C 198,90 200,100 210,100 C 220,100 225,95 225,85 L 225,58 L 240,58 L 240,85 C 235,80 225,80 220,85 C 213,90 215,100 225,100 C 235,100 240,95 240,85 L 240,40 L 205,40 C 195,40 190,50 190,70 Z" fill="#ec4899"/>
    <!-- Nota 2 -->
    <path d="M 610,75 C 610,65 620,55 635,55 L 635,95 C 630,90 620,90 615,95 C 608,100 610,110 620,110 C 630,110 635,105 635,95 L 635,65 L 650,65 L 650,50 L 630,50 C 620,50 610,60 610,75 Z" fill="#06b6d4"/>
  </g>
</svg>
