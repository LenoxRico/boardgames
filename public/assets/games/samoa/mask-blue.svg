<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Madera Oceánica Azul -->
    <linearGradient id="blueWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="80%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>

    <!-- Gradientes de Plumas Azules -->
    <linearGradient id="featherBlueMain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="35%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="featherBlueSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Sombra suave inferior -->
    <filter id="shadowBlue" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#shadowBlue)">
    <!-- Corona de Plumas Oceánicas Azules -->
    <!-- Pluma izquierda exterior -->
    <path d="M 28,38 C 14,24 6,12 10,4 C 20,12 26,24 32,38 Z" fill="url(#featherBlueSide)"/>
    <path d="M 10,4 Q 20,22 30,38" stroke="#e0f2fe" stroke-width="1" stroke-linecap="round"/>

    <!-- Pluma izquierda interior -->
    <path d="M 36,34 C 28,16 26,4 32,1 C 38,10 40,22 42,34 Z" fill="url(#featherBlueMain)"/>
    <path d="M 32,1 Q 37,18 39,34" stroke="#e0f2fe" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Pluma central erguida (Espíritu de las Mareas) -->
    <path d="M 50,30 C 44,14 46,2 50,0 C 54,2 56,14 50,30 Z" fill="url(#featherBlueMain)"/>
    <path d="M 50,0 L 50,30" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Pluma derecha interior -->
    <path d="M 64,34 C 72,16 74,4 68,1 C 62,10 60,22 58,34 Z" fill="url(#featherBlueMain)"/>
    <path d="M 68,1 Q 63,18 61,34" stroke="#e0f2fe" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Pluma derecha exterior -->
    <path d="M 72,38 C 86,24 94,12 90,4 C 80,12 74,24 68,38 Z" fill="url(#featherBlueSide)"/>
    <path d="M 90,4 Q 80,22 70,38" stroke="#e0f2fe" stroke-width="1" stroke-linecap="round"/>

    <!-- Cuerpo de la Máscara Tallada Tiki (Forma Suave de Gota y Olas) -->
    <path d="M 22,32 C 16,56 16,84 26,108 C 40,117 60,117 74,108 C 84,84 84,56 78,32 C 60,26 40,26 22,32 Z"
          fill="url(#blueWood)" stroke="#bae6fd" stroke-width="2" stroke-linejoin="round"/>

    <!-- Vinchas de la Frente: Olas del Mar Pacífico -->
    <path d="M 24,42 Q 32,38 40,42 T 56,42 T 72,42 T 76,42" stroke="#e0f2fe" stroke-width="2" fill="none"/>
    <path d="M 26,48 Q 38,44 50,48 T 74,48" stroke="#38bdf8" stroke-width="1.5" fill="none"/>

    <!-- Tatuaje Frontal: Gota del Océano Profundo -->
    <path d="M 50,43 C 46,47 45,51 50,54 C 55,51 54,47 50,43 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <circle cx="50" cy="51" r="1.5" fill="#38bdf8"/>

    <!-- Ojos Profundos del Océano (Almendrados Místicos con Brillo Azul) -->
    <!-- Ojo Izquierdo -->
    <path d="M 26,63 Q 37,56 47,63 Q 37,70 26,63 Z" fill="#041624" stroke="#7dd3fc" stroke-width="1.8"/>
    <circle cx="37" cy="63" r="3.5" fill="#0ea5e9"/>
    <circle cx="38" cy="62" r="1.5" fill="#ffffff"/>

    <!-- Ojo Derecho -->
    <path d="M 74,63 Q 63,56 53,63 Q 63,70 74,63 Z" fill="#041624" stroke="#7dd3fc" stroke-width="1.8"/>
    <circle cx="63" cy="63" r="3.5" fill="#0ea5e9"/>
    <circle cx="62" cy="62" r="1.5" fill="#ffffff"/>

    <!-- Nariz Esculpida con Vértice de Ola -->
    <path d="M 50,56 L 44,76 L 56,76 Z" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Tatuajes de Olas en las Mejillas -->
    <path d="M 24,74 Q 28,71 33,74 T 37,74" stroke="#e0f2fe" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 26,80 Q 30,77 35,80" stroke="#7dd3fc" stroke-width="1.6" fill="none" stroke-linecap="round"/>

    <path d="M 76,74 Q 72,71 67,74 T 63,74" stroke="#e0f2fe" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 74,80 Q 70,77 65,80" stroke="#7dd3fc" stroke-width="1.6" fill="none" stroke-linecap="round"/>

    <!-- Boca Abierta Serena (Canto de las Caracolas) -->
    <ellipse cx="50" cy="94" rx="14" ry="8" fill="#041624" stroke="#bae6fd" stroke-width="2"/>
    <!-- Dientes de concha de mar -->
    <path d="M 40,91 Q 50,94 60,91" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 43,97 Q 50,95 57,97" stroke="#38bdf8" stroke-width="1.8" fill="none" stroke-linecap="round"/>

    <!-- Barbilla con Gotas Sagradas -->
    <circle cx="43" cy="110" r="2" fill="#7dd3fc"/>
    <circle cx="50" cy="111" r="2.5" fill="#e0f2fe"/>
    <circle cx="57" cy="110" r="2" fill="#7dd3fc"/>
  </g>
</svg>
