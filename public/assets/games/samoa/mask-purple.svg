<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Madera Mística Morada / Púrpura -->
    <linearGradient id="purpleWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="40%" stop-color="#8b5cf6"/>
      <stop offset="80%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>

    <!-- Gradientes de Plumas Moradas y Amatistas -->
    <linearGradient id="featherPurpleMain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ddd6fe"/>
      <stop offset="35%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <linearGradient id="featherPurpleSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="60%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>

    <!-- Sombra suave inferior -->
    <filter id="shadowPurple" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#shadowPurple)">
    <!-- Corona de Plumas Espirituales Moradas -->
    <!-- Pluma izquierda exterior -->
    <path d="M 28,38 C 14,24 8,11 12,3 C 22,11 28,23 32,38 Z" fill="url(#featherPurpleSide)"/>
    <path d="M 12,3 Q 22,21 30,38" stroke="#ede9fe" stroke-width="1" stroke-linecap="round"/>

    <!-- Pluma izquierda interior -->
    <path d="M 36,34 C 28,16 26,4 32,0 C 38,9 40,21 42,34 Z" fill="url(#featherPurpleMain)"/>
    <path d="M 32,0 Q 37,17 39,34" stroke="#ede9fe" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Pluma central erguida (Pluma del Chamán Ancestral) -->
    <path d="M 50,30 C 44,13 46,1 50,-2 C 54,1 56,13 50,30 Z" fill="url(#featherPurpleMain)"/>
    <path d="M 50,-2 L 50,30" stroke="#fbcfe8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Pluma derecha interior -->
    <path d="M 64,34 C 72,16 74,4 68,0 C 62,9 60,21 58,34 Z" fill="url(#featherPurpleMain)"/>
    <path d="M 68,0 Q 63,17 61,34" stroke="#ede9fe" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Pluma derecha exterior -->
    <path d="M 72,38 C 86,24 92,11 88,3 C 78,11 72,23 68,38 Z" fill="url(#featherPurpleSide)"/>
    <path d="M 88,3 Q 78,21 70,38" stroke="#ede9fe" stroke-width="1" stroke-linecap="round"/>

    <!-- Cuerpo de la Máscara Tallada Tiki (Forma Mística de Tótem Ancestral) -->
    <path d="M 20,32 C 16,56 16,84 26,108 C 40,117 60,117 74,108 C 84,84 84,56 80,32 C 60,26 40,26 20,32 Z"
          fill="url(#purpleWood)" stroke="#ddd6fe" stroke-width="2" stroke-linejoin="round"/>

    <!-- Vinchas de la Frente Espiritual -->
    <path d="M 23,41 Q 50,35 77,41" stroke="#f5d0fe" stroke-width="2" fill="none"/>
    <path d="M 25,47 Q 50,42 75,47" stroke="#c084fc" stroke-width="1.5" fill="none"/>

    <!-- Tatuaje Central: Amuleto de Luna / Tercer Ojo Chamánico -->
    <path d="M 44,48 A 6 6 0 1 0 56,48 A 4.5 4.5 0 0 1 44,48 Z" fill="#fbcfe8" stroke="#6b21a8" stroke-width="1"/>
    <circle cx="50" cy="51" r="1.5" fill="#fdf4ff"/>

    <!-- Ojos Místicos e Hipnóticos (Mirada Espiritual del Chamán) -->
    <!-- Ojo Izquierdo -->
    <path d="M 26,63 Q 37,55 46,63 Q 37,71 26,63 Z" fill="#1e0b36" stroke="#c084fc" stroke-width="1.8"/>
    <circle cx="36" cy="63" r="3.5" fill="#a855f7"/>
    <circle cx="37" cy="62" r="1.5" fill="#ffffff"/>

    <!-- Ojo Derecho -->
    <path d="M 74,63 Q 63,55 54,63 Q 63,71 74,63 Z" fill="#1e0b36" stroke="#c084fc" stroke-width="1.8"/>
    <circle cx="64" cy="63" r="3.5" fill="#a855f7"/>
    <circle cx="63" cy="62" r="1.5" fill="#ffffff"/>

    <!-- Nariz Tallada Mística de Madera -->
    <polygon points="50,56 45,76 55,76" fill="#581c87" stroke="#c084fc" stroke-width="1.5"/>

    <!-- Runas Espirituales en las Mejillas -->
    <path d="M 24,74 Q 29,71 34,75" stroke="#f5d0fe" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="28" cy="80" r="1.8" fill="#fbcfe8"/>
    <circle cx="33" cy="81" r="1.8" fill="#c084fc"/>

    <path d="M 76,74 Q 71,71 66,75" stroke="#f5d0fe" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="72" cy="80" r="1.8" fill="#fbcfe8"/>
    <circle cx="67" cy="81" r="1.8" fill="#c084fc"/>

    <!-- Boca Tallada Solemne y Misteriosa (Susurro Ancestral) -->
    <path d="M 33,88 Q 50,86 67,88 Q 65,99 50,100 Q 35,99 33,88 Z" fill="#1e0b36" stroke="#ddd6fe" stroke-width="2"/>
    <!-- Grabados Sagrados en la Boca -->
    <path d="M 38,94 L 62,94" stroke="#f5d0fe" stroke-width="2" stroke-linecap="round"/>
    <line x1="43" y1="91" x2="43" y2="97" stroke="#c084fc" stroke-width="1.5"/>
    <line x1="50" y1="90" x2="50" y2="98" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="57" y1="91" x2="57" y2="97" stroke="#c084fc" stroke-width="1.5"/>

    <!-- Grabados del Mentón Púrpura -->
    <circle cx="43" cy="110" r="2" fill="#c084fc"/>
    <circle cx="50" cy="111" r="2.5" fill="#f5d0fe"/>
    <circle cx="57" cy="110" r="2" fill="#c084fc"/>
  </g>
</svg>
