<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Madera de Jade Verde -->
    <linearGradient id="greenWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="80%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <!-- Gradientes de Plumas Verdes -->
    <linearGradient id="featherGreenMain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="35%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="featherGreenSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <!-- Sombra suave inferior -->
    <filter id="shadowGreen" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#shadowGreen)">
    <!-- Corona de Plumas de Selva Verdes -->
    <!-- Pluma izquierda exterior -->
    <path d="M 28,38 C 14,24 8,10 12,2 C 22,10 28,22 32,38 Z" fill="url(#featherGreenSide)"/>
    <path d="M 12,2 Q 22,20 30,38" stroke="#d1fae5" stroke-width="1" stroke-linecap="round"/>

    <!-- Pluma izquierda interior -->
    <path d="M 36,34 C 28,16 26,4 32,0 C 38,8 40,20 42,34 Z" fill="url(#featherGreenMain)"/>
    <path d="M 32,0 Q 37,16 39,34" stroke="#d1fae5" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Pluma central erguida (Pluma de Helecho Sagrado) -->
    <path d="M 50,30 C 44,12 46,0 50,-2 C 54,0 56,12 50,30 Z" fill="url(#featherGreenMain)"/>
    <path d="M 50,-2 L 50,30" stroke="#fde047" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Pluma derecha interior -->
    <path d="M 64,34 C 72,16 74,4 68,0 C 62,8 60,20 58,34 Z" fill="url(#featherGreenMain)"/>
    <path d="M 68,0 Q 63,16 61,34" stroke="#d1fae5" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Pluma derecha exterior -->
    <path d="M 72,38 C 86,24 92,10 88,2 C 78,10 72,22 68,38 Z" fill="url(#featherGreenSide)"/>
    <path d="M 88,2 Q 78,20 70,38" stroke="#d1fae5" stroke-width="1" stroke-linecap="round"/>

    <!-- Cuerpo de la Máscara Tallada Tiki (Forma Orgánica de Hoja y Madera) -->
    <path d="M 22,32 C 14,56 16,84 28,108 C 42,117 58,117 72,108 C 84,84 86,56 78,32 C 60,27 40,27 22,32 Z"
          fill="url(#greenWood)" stroke="#a7f3d0" stroke-width="2" stroke-linejoin="round"/>

    <!-- Corona de la Frente con Diseños Vegetales -->
    <path d="M 25,41 Q 50,35 75,41" stroke="#d1fae5" stroke-width="2" fill="none"/>
    <path d="M 27,47 Q 50,42 73,47" stroke="#34d399" stroke-width="1.5" fill="none"/>

    <!-- Grabado de Espiral Sagrada Koru (Renovación de Vida) -->
    <path d="M 50,45 A 4 4 0 1 1 50,53 A 2 2 0 1 1 50,49" stroke="#fef08a" stroke-width="1.8" fill="none" stroke-linecap="round"/>

    <!-- Ojos de Sabio Astuto (Grandes, Circulares y Penetrantes) -->
    <!-- Ojo Izquierdo -->
    <ellipse cx="37" cy="64" rx="10" ry="7" fill="#03281e" stroke="#6ee7b7" stroke-width="2"/>
    <circle cx="37" cy="64" r="4" fill="#34d399"/>
    <circle cx="38" cy="62" r="1.5" fill="#ffffff"/>

    <!-- Ojo Derecho -->
    <ellipse cx="63" cy="64" rx="10" ry="7" fill="#03281e" stroke="#6ee7b7" stroke-width="2"/>
    <circle cx="63" cy="64" r="4" fill="#34d399"/>
    <circle cx="64" cy="62" r="1.5" fill="#ffffff"/>

    <!-- Nariz Tallada Estilizada -->
    <path d="M 50,57 Q 44,70 43,76 Q 50,80 57,76 Q 56,70 50,57 Z" fill="#065f46" stroke="#6ee7b7" stroke-width="1.5"/>

    <!-- Espirales Tribales Polinesias en las Mejillas -->
    <!-- Espiral izquierda -->
    <path d="M 23,75 Q 28,70 33,75 T 29,82" stroke="#d1fae5" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- Espiral derecha -->
    <path d="M 77,75 Q 72,70 67,75 T 71,82" stroke="#d1fae5" stroke-width="1.6" fill="none" stroke-linecap="round"/>

    <!-- Boca Misteriosa Sonriente (Tiki de la Sabiduría) -->
    <path d="M 33,88 Q 50,96 67,88 Q 63,103 50,103 Q 37,103 33,88 Z" fill="#03281e" stroke="#a7f3d0" stroke-width="2"/>
    <!-- Dientes rúnicos geométricos -->
    <rect x="38" y="90" width="5" height="6" rx="1" fill="#f0fdf4" stroke="#047857" stroke-width="1"/>
    <rect x="45" y="91" width="5" height="7" rx="1" fill="#f0fdf4" stroke="#047857" stroke-width="1"/>
    <rect x="52" y="91" width="5" height="7" rx="1" fill="#f0fdf4" stroke="#047857" stroke-width="1"/>
    <rect x="59" y="90" width="5" height="6" rx="1" fill="#f0fdf4" stroke="#047857" stroke-width="1"/>

    <!-- Grabados del Mentón (Raíces Sagradas) -->
    <circle cx="43" cy="110" r="2" fill="#34d399"/>
    <circle cx="50" cy="111" r="2.5" fill="#fef08a"/>
    <circle cx="57" cy="110" r="2" fill="#34d399"/>
  </g>
</svg>
