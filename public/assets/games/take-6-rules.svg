<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="t6rBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1326"/>
      <stop offset="50%" stop-color="#210a0a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <radialGradient id="t6rDangerGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0b1326" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente de Cuernos de Toro -->
    <linearGradient id="t6rHorns" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Gradiente de Carta Segura -->
    <linearGradient id="t6rSafeCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Gradiente de la 6ta Carta (Peligro Letal) -->
    <linearGradient id="t6rDangerCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="50%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>

    <filter id="t6rFire" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo Card Panorámico -->
  <rect width="800" height="400" rx="16" fill="url(#t6rBg)"/>
  <rect width="800" height="400" rx="16" fill="url(#t6rDangerGlow)"/>

  <!-- Fila de Cartas del Tablero (Cartas 1 a 5 seguras, y la fatal 6ta) -->
  <g transform="translate(400, 310)">
    <!-- Indicador de Fila 1 a 5 -->
    <!-- Carta 1: Valor 14 (1 buey) -->
    <g transform="translate(-270, 0)">
      <rect x="-30" y="-45" width="60" height="90" rx="6" fill="url(#t6rSafeCard)" stroke="#10b981" stroke-width="2"/>
      <text x="0" y="-18" fill="#34d399" font-family="system-ui, sans-serif" font-size="16" font-weight="900" text-anchor="middle">14</text>
      <!-- Icono Buey 1 -->
      <text x="0" y="15" fill="#10b981" font-size="16" text-anchor="middle">🐂</text>
    </g>

    <!-- Carta 2: Valor 28 (1 buey) -->
    <g transform="translate(-165, 0)">
      <rect x="-30" y="-45" width="60" height="90" rx="6" fill="url(#t6rSafeCard)" stroke="#10b981" stroke-width="2"/>
      <text x="0" y="-18" fill="#34d399" font-family="system-ui, sans-serif" font-size="16" font-weight="900" text-anchor="middle">28</text>
      <text x="0" y="15" fill="#10b981" font-size="16" text-anchor="middle">🐂</text>
    </g>

    <!-- Carta 3: Valor 45 (2 bueyes) -->
    <g transform="translate(-60, 0)">
      <rect x="-30" y="-45" width="60" height="90" rx="6" fill="url(#t6rSafeCard)" stroke="#10b981" stroke-width="2"/>
      <text x="0" y="-18" fill="#34d399" font-family="system-ui, sans-serif" font-size="16" font-weight="900" text-anchor="middle">45</text>
      <text x="0" y="15" fill="#f59e0b" font-size="16" text-anchor="middle">🐂🐂</text>
    </g>

    <!-- Carta 4: Valor 63 (1 buey) -->
    <g transform="translate(45, 0)">
      <rect x="-30" y="-45" width="60" height="90" rx="6" fill="url(#t6rSafeCard)" stroke="#10b981" stroke-width="2"/>
      <text x="0" y="-18" fill="#34d399" font-family="system-ui, sans-serif" font-size="16" font-weight="900" text-anchor="middle">63</text>
      <text x="0" y="15" fill="#10b981" font-size="16" text-anchor="middle">🐂</text>
    </g>

    <!-- Carta 5: Valor 77 (5 bueyes) - Llena la fila -->
    <g transform="translate(150, 0)">
      <rect x="-30" y="-45" width="60" height="90" rx="6" fill="#1e1b4b" stroke="#f59e0b" stroke-width="2.5"/>
      <text x="0" y="-18" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="16" font-weight="900" text-anchor="middle">77</text>
      <text x="0" y="15" fill="#f59e0b" font-size="13" text-anchor="middle">🐂×5</text>
    </g>

    <!-- La 6ta Carta Fatal: ¡TOMA 6! Alerta y Explosión -->
    <g transform="translate(265, -5) rotate(10)" filter="url(#t6rFire)">
      <rect x="-34" y="-50" width="68" height="100" rx="8" fill="url(#t6rDangerCard)" stroke="#ef4444" stroke-width="3"/>
      <text x="0" y="-20" fill="#fecaca" font-family="system-ui, sans-serif" font-size="20" font-weight="900" text-anchor="middle">82</text>
      <text x="0" y="6" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle">¡6ª CARTA!</text>
      <!-- Calavera de Buey de Penalización -->
      <text x="0" y="32" fill="#ef4444" font-size="18" text-anchor="middle">💀</text>
    </g>
  </g>

  <!-- Gran Toro de Furia ¡Toma 6! (Centro) -->
  <g transform="translate(400, 140)">
    <!-- Humo y Resoplido del Toro -->
    <path d="M -90,75 Q -140,80 -170,105 Q -130,115 -100,90" fill="none" stroke="#fca5a5" stroke-width="3" opacity="0.7"/>
    <path d="M 90,75 Q 140,80 170,105 Q 130,115 100,90" fill="none" stroke="#fca5a5" stroke-width="3" opacity="0.7"/>

    <!-- Enormes Cuernos Curvos de Toro Dorado -->
    <!-- Cuerno Izquierdo -->
    <path d="M -50,-20 C -105,-60 -170,-80 -210,-45 C -220,-30 -195,10 -120,-5 C -85,-10 -65,-10 -45,-5 Z"
          fill="url(#t6rHorns)" stroke="#fef08a" stroke-width="3.5" filter="url(#t6rFire)"/>
    <!-- Cuerno Derecho -->
    <path d="M 50,-20 C 105,-60 170,-80 210,-45 C 220,-30 195,10 120,-5 C 85,-10 65,-10 45,-5 Z"
          fill="url(#t6rHorns)" stroke="#fef08a" stroke-width="3.5" filter="url(#t6rFire)"/>

    <!-- Cabeza del Toro Titán -->
    <path d="M -60,-35 C -75,10 -70,60 -50,95 C -30,130 0,145 0,145 C 0,145 30,130 50,95 C 70,60 75,10 60,-35 C 35,-55 -35,-55 -60,-35 Z"
          fill="#1c1917" stroke="#ef4444" stroke-width="3.5"/>

    <!-- Frente Blindada y Tatuaje del Número 6 -->
    <circle cx="0" cy="-5" r="26" fill="#7f1d1d" stroke="#ef4444" stroke-width="2.5"/>
    <text x="0" y="6" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="900" text-anchor="middle">6</text>

    <!-- Ojos Rojos de Ataque -->
    <ellipse cx="-30" cy="35" rx="14" ry="7" transform="rotate(-18, -30, 35)" fill="#ef4444"/>
    <ellipse cx="30" cy="35" rx="14" ry="7" transform="rotate(18, 30, 35)" fill="#ef4444"/>
    <circle cx="-30" cy="35" r="4.5" fill="#ffffff"/>
    <circle cx="30" cy="35" r="4.5" fill="#ffffff"/>

    <!-- Hocico Potente con Argolla Dorada -->
    <ellipse cx="0" cy="98" rx="38" ry="24" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
    <circle cx="-16" cy="100" r="7" fill="#000000"/>
    <circle cx="16" cy="100" r="7" fill="#000000"/>
    <!-- Argolla de Oro -->
    <circle cx="0" cy="125" r="16" fill="none" stroke="url(#t6rHorns)" stroke-width="5"/>
  </g>
</svg>
