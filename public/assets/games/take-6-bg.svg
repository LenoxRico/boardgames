<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Gradiente de Campo y Pradera Táctica -->
    <radialGradient id="take6Glow" cx="75%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="45%" stop-color="#047857" stop-opacity="0.15"/>
      <stop offset="85%" stop-color="#064e3b" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0b1326" stop-opacity="0"/>
    </radialGradient>

    <!-- Resplandor de Alerta de Cuernos (66 Puntos) -->
    <radialGradient id="bullGlow" cx="65%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#dc2626" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0b1326" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="hornGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Atmósfera General -->
  <rect width="800" height="600" fill="url(#take6Glow)"/>
  <circle cx="560" cy="240" r="260" fill="url(#bullGlow)"/>

  <!-- Cuadrícula Esquemática de las 4 Filas de Cartas de Toma 6 -->
  <g opacity="0.18" stroke="#34d399" stroke-width="1.5" fill="none">
    <!-- Fila 1 -->
    <rect x="60" y="80" width="75" height="110" rx="8" stroke-dasharray="4,4"/>
    <rect x="150" y="80" width="75" height="110" rx="8"/>
    <rect x="240" y="80" width="75" height="110" rx="8"/>
    <rect x="330" y="80" width="75" height="110" rx="8"/>
    <rect x="420" y="80" width="75" height="110" rx="8"/>
    <!-- La 6ª Carta (¡Peligro!) -->
    <rect x="510" y="80" width="75" height="110" rx="8" stroke="#ef4444" stroke-width="2.5" fill="rgba(239, 68, 68, 0.08)"/>

    <!-- Fila 2 -->
    <rect x="60" y="210" width="75" height="110" rx="8"/>
    <rect x="150" y="210" width="75" height="110" rx="8"/>
    <rect x="240" y="210" width="75" height="110" rx="8"/>
    <rect x="330" y="210" width="75" height="110" rx="8"/>
    <!-- Fila 3 -->
    <rect x="60" y="340" width="75" height="110" rx="8"/>
    <rect x="150" y="340" width="75" height="110" rx="8"/>
    <rect x="240" y="340" width="75" height="110" rx="8"/>
    <!-- Fila 4 -->
    <rect x="60" y="470" width="75" height="110" rx="8"/>
    <rect x="150" y="470" width="75" height="110" rx="8"/>
  </g>

  <!-- Cartas Gigantes Superpuestas en Perspectiva -->
  <g transform="translate(420, 160) rotate(-12)" opacity="0.3">
    <rect x="0" y="0" width="130" height="190" rx="14" fill="#131e38" stroke="#34d399" stroke-width="2.5"/>
    <text x="18" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="34" fill="#34d399">55</text>
    <text x="75" y="170" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="34" fill="#34d399">55</text>
    <!-- 7 Cuernos en el centro (Carta 55 con 7 cabezas de buey) -->
    <text x="35" y="110" font-size="28" fill="#ef4444">🐂x7</text>
  </g>

  <g transform="translate(480, 140) rotate(8)" opacity="0.35">
    <rect x="0" y="0" width="130" height="190" rx="14" fill="#131e38" stroke="#ef4444" stroke-width="3"/>
    <text x="18" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="36" fill="#ef4444">66</text>
    <text x="75" y="170" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="36" fill="#ef4444">66</text>
    <circle cx="65" cy="95" r="28" fill="rgba(239, 68, 68, 0.15)"/>
    <text x="48" y="105" font-size="30">🐂</text>
  </g>

  <!-- Gran Silueta del Buey Astado de Take 6 (Marca de Agua Principal) -->
  <g transform="translate(430, 80) scale(1.15)" opacity="0.45">
    <!-- Cuernos Curvos Majestuosos -->
    <path d="M 60,110 C 20,40 -20,10 -70,20 C -75,30 -50,60 10,95 C 35,115 50,125 60,135 Z" fill="url(#hornGrad)"/>
    <path d="M 180,110 C 220,40 260,10 310,20 C 315,30 290,60 230,95 C 205,115 190,125 180,135 Z" fill="url(#hornGrad)"/>

    <!-- Cabeza del Buey -->
    <path d="M 60,120 C 50,140 45,180 55,220 C 65,260 85,310 120,325 C 155,310 175,260 185,220 C 195,180 190,140 180,120 C 160,105 80,105 60,120 Z" fill="#0b1326" stroke="#34d399" stroke-width="3"/>

    <!-- Frente y Estructura Ósea -->
    <polygon points="120,135 150,180 120,240 90,180" fill="rgba(52, 211, 153, 0.15)" stroke="#34d399" stroke-width="1.5"/>

    <!-- Orejas de Toro -->
    <path d="M 52,145 C 25,150 15,170 30,185 C 45,180 50,165 52,145 Z" fill="#047857"/>
    <path d="M 188,145 C 215,150 225,170 210,185 C 195,180 190,165 188,145 Z" fill="#047857"/>

    <!-- Ojos Amenazantes Rojos / Ámbar -->
    <ellipse cx="85" cy="185" rx="14" ry="8" transform="rotate(-15, 85, 185)" fill="#ef4444"/>
    <ellipse cx="155" cy="185" rx="14" ry="8" transform="rotate(15, 155, 185)" fill="#ef4444"/>
    <circle cx="85" cy="185" r="4" fill="#fef08a"/>
    <circle cx="155" cy="185" r="4" fill="#fef08a"/>

    <!-- Hocico y Nariz de Buey -->
    <ellipse cx="120" cy="285" rx="35" ry="24" fill="#047857" opacity="0.6"/>
    <!-- Orificios Nasales Exhalando Vaho -->
    <ellipse cx="106" cy="288" rx="8" ry="10" fill="#0b1326"/>
    <ellipse cx="134" cy="288" rx="8" ry="10" fill="#0b1326"/>
    <!-- Aro en la Nariz -->
    <path d="M 112,298 C 112,320 128,320 128,298" stroke="#fbbf24" stroke-width="3.5" fill="none"/>
  </g>
</svg>
