<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Gradiente del Egeo y Olimpo -->
    <radialGradient id="minoGlow" cx="65%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.38"/>
      <stop offset="40%" stop-color="#312e81" stop-opacity="0.25"/>
      <stop offset="75%" stop-color="#1e1b4b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0b1326" stop-opacity="0"/>
    </radialGradient>

    <!-- Resplandor de Bronce y Fuego Cretense -->
    <radialGradient id="bronzeGlow" cx="60%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#c2410c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0b1326" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente Turquesa Mítico -->
    <linearGradient id="minoTurquoise" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Gradiente de Bronce Cretense -->
    <linearGradient id="minoBronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Gradiente de Piedra del Laberinto -->
    <linearGradient id="stoneHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0b1326" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Atmósfera Mística del Laberinto -->
  <rect width="600" height="600" fill="url(#minoGlow)"/>
  <circle cx="410" cy="230" r="230" fill="url(#bronzeGlow)"/>

  <!-- Greca y Patrón Concéntrico del Laberinto de Creta -->
  <g opacity="0.22" stroke="#22d3ee" stroke-width="2" fill="none">
    <circle cx="410" cy="230" r="215" stroke-dasharray="16,8"/>
    <circle cx="410" cy="230" r="185"/>
    <circle cx="410" cy="230" r="145" stroke-dasharray="8,6"/>
    <circle cx="410" cy="230" r="110"/>
    <!-- Pasadizos del Laberinto -->
    <path d="M 195,230 L 255,230 M 410,45 L 410,105 M 565,230 L 625,230 M 410,355 L 410,415"/>
    <path d="M 290,230 A 120 120 0 0 1 530,230 A 120 120 0 0 1 290,230" stroke-dasharray="12,6"/>
  </g>

  <!-- Dados Poliédricos Míticos Flotando -->
  <!-- Dado 1: Isométrico en Perspectiva (Superior Izquierda) -->
  <g transform="translate(230, 95) rotate(18)" opacity="0.9">
    <polygon points="35,0 70,20 35,40 0,20" fill="#312e81" stroke="#22d3ee" stroke-width="2.5"/>
    <polygon points="0,20 35,40 35,80 0,60" fill="#0f172a" stroke="#22d3ee" stroke-width="2.5"/>
    <polygon points="35,40 70,20 70,60 35,80" fill="#0d9488" stroke="#22d3ee" stroke-width="2.5"/>
    <!-- Puntos Místicos del Dado -->
    <circle cx="35" cy="20" r="4" fill="#fbbf24"/>
    <circle cx="18" cy="50" r="3.5" fill="#67e8f9"/>
    <circle cx="52" cy="50" r="3.5" fill="#67e8f9"/>
  </g>

  <!-- Dado 2: Rúnico de Bronce (Inferior Derecha) -->
  <g transform="translate(485, 305) rotate(-20)" opacity="0.9">
    <polygon points="30,0 60,18 30,36 0,18" fill="url(#minoBronze)" stroke="#fbbf24" stroke-width="2.5"/>
    <polygon points="0,18 30,36 30,72 0,54" fill="#78350f" stroke="#fbbf24" stroke-width="2.5"/>
    <polygon points="30,36 60,18 60,54 30,72" fill="#c2410c" stroke="#fbbf24" stroke-width="2.5"/>
    <circle cx="30" cy="18" r="4" fill="#ffffff"/>
    <circle cx="15" cy="45" r="3" fill="#fde047"/>
    <circle cx="45" cy="45" r="3" fill="#fde047"/>
  </g>

  <!-- Símbolos de las Criaturas: Grifo y Sirena -->
  <!-- Alas del Grifo (Dorado) -->
  <path d="M 505,130 C 545,90 580,85 610,105 C 585,135 550,165 505,175 C 555,185 585,210 570,240 C 540,230 510,205 495,190 Z"
        fill="url(#minoBronze)" opacity="0.88" stroke="#fde047" stroke-width="2"/>
  <!-- Cola y Olas de la Sirena (Turquesa) -->
  <path d="M 235,275 C 265,240 310,250 335,230 C 320,270 280,300 240,320 C 285,310 320,335 305,365 C 270,350 240,320 220,295 Z"
        fill="url(#minoTurquoise)" opacity="0.88" stroke="#67e8f9" stroke-width="2"/>

  <!-- Cabeza Imponente del Minotauro (Centro en 410, 230) -->
  <g transform="translate(410, 230)" opacity="0.95">
    <!-- Grandes Cuernos de Bronce del Minotauro -->
    <!-- Cuerno Izquierdo -->
    <path d="M -45,-30 C -85,-75 -135,-95 -180,-80 C -185,-65 -160,-35 -100, -10 C -70,2 -55,10 -40,15 Z"
          fill="url(#minoBronze)" stroke="#fde047" stroke-width="3"/>
    <!-- Cuerno Derecho -->
    <path d="M 45,-30 C 85,-75 135,-95 180,-80 C 185,-65 160,-35 100, -10 C 70,2 55,10 40,15 Z"
          fill="url(#minoBronze)" stroke="#fde047" stroke-width="3"/>

    <!-- Anillos y Detalles de los Cuernos -->
    <path d="M -125,-48 C -135,-35 -145,-25 -135,-15" stroke="#78350f" stroke-width="3" fill="none"/>
    <path d="M 125,-48 C 135,-35 145,-25 135,-15" stroke="#78350f" stroke-width="3" fill="none"/>

    <!-- Silueta del Rostro del Minotauro -->
    <path d="M -50,-40 C -60,-15 -65,30 -50,75 C -35,115 -15,145 0,155 C 15,145 35,115 50,75 C 65,30 60,-15 50,-40 C 30,-60 -30,-60 -50,-40 Z"
          fill="url(#stoneHead)" stroke="#06b6d4" stroke-width="3.5"/>

    <!-- Ojos de Furia Ancestral -->
    <ellipse cx="-25" cy="5" rx="14" ry="7" transform="rotate(-15, -25, 5)" fill="#f59e0b"/>
    <ellipse cx="25" cy="5" rx="14" ry="7" transform="rotate(15, 25, 5)" fill="#f59e0b"/>
    <circle cx="-25" cy="5" r="4.5" fill="#ffffff"/>
    <circle cx="25" cy="5" r="4.5" fill="#ffffff"/>
    <ellipse cx="-26" cy="5" rx="2" ry="4.5" fill="#0b1326"/>
    <ellipse cx="26" cy="5" rx="2" ry="4.5" fill="#0b1326"/>

    <!-- Ceño Fruncido y Líneas de Fuerza -->
    <path d="M -38,-10 L 0,8 L 38,-10" stroke="#06b6d4" stroke-width="3" fill="none"/>
    <path d="M 0,8 L 0,60" stroke="#06b6d4" stroke-width="2.5" fill="none"/>

    <!-- Hocico Potente -->
    <ellipse cx="0" cy="85" rx="34" ry="24" fill="#312e81" stroke="#22d3ee" stroke-width="2.5"/>
    <circle cx="-13" cy="88" r="7" fill="#0b1326" stroke="#22d3ee" stroke-width="1.5"/>
    <circle cx="13" cy="88" r="7" fill="#0b1326" stroke="#22d3ee" stroke-width="1.5"/>

    <!-- Aro de Bronce del Minotauro (Septum Ring) -->
    <circle cx="0" cy="115" r="18" fill="none" stroke="url(#minoBronze)" stroke-width="5"/>
    <path d="M -10,100 L 10,100" stroke="#fbbf24" stroke-width="3"/>
  </g>
</svg>
