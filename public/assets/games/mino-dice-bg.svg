<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Gradiente del Egeo y Olimpo -->
    <radialGradient id="minoGlow" cx="70%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="45%" stop-color="#312e81" stop-opacity="0.2"/>
      <stop offset="85%" stop-color="#1e1b4b" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0b1326" stop-opacity="0"/>
    </radialGradient>

    <!-- Resplandor de Bronce y Fuego Cretense -->
    <radialGradient id="bronzeGlow" cx="55%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#c2410c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0b1326" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="minoTurquoise" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#0d9488" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="minoBronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Atmósfera Mística del Laberinto -->
  <rect width="800" height="600" fill="url(#minoGlow)"/>
  <circle cx="580" cy="220" r="280" fill="url(#bronzeGlow)"/>

  <!-- Greca y Patrón Concéntrico del Laberinto de Creta -->
  <g opacity="0.16" stroke="#22d3ee" stroke-width="2" fill="none">
    <circle cx="550" cy="250" r="240" stroke-dasharray="16,8"/>
    <circle cx="550" cy="250" r="190"/>
    <circle cx="550" cy="250" r="140" stroke-dasharray="8,6"/>
    <circle cx="550" cy="250" r="90"/>

    <!-- Pasadizos del Laberinto -->
    <path d="M 310,250 L 370,250 M 550,60 L 550,110 M 740,250 L 790,250 M 550,390 L 550,440"/>
    <path d="M 410,250 A 140 140 0 0 1 690,250 A 140 140 0 0 1 410,250"/>
    <path d="M 460,250 A 90 90 0 0 1 640,250 A 90 90 0 0 1 460,250"/>
  </g>

  <!-- Dados Poliédricos Míticos Flotando en el Laberinto -->
  <!-- Dado 1: Isométrico en Perspectiva -->
  <g transform="translate(180, 120) rotate(15)" opacity="0.35">
    <!-- Caras del Dado -->
    <polygon points="50,0 100,28 50,56 0,28" fill="#1e1b4b" stroke="#06b6d4" stroke-width="2"/>
    <polygon points="0,28 50,56 50,112 0,84" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
    <polygon points="50,56 100,28 100,84 50,112" fill="#0d9488" stroke="#06b6d4" stroke-width="2"/>
    <!-- Puntos Místicos del Dado -->
    <circle cx="50" cy="28" r="5" fill="#f59e0b"/>
    <circle cx="25" cy="70" r="4" fill="#67e8f9"/>
    <circle cx="25" cy="85" r="4" fill="#67e8f9"/>
    <circle cx="75" cy="70" r="4" fill="#67e8f9"/>
    <circle cx="75" cy="85" r="4" fill="#67e8f9"/>
    <circle cx="75" cy="55" r="4" fill="#67e8f9"/>
  </g>

  <!-- Dado 2: Girando en el fondo con Símbolo del Minotauro -->
  <g transform="translate(620, 360) rotate(-22)" opacity="0.3">
    <polygon points="45,0 90,25 45,50 0,25" fill="#312e81" stroke="#f59e0b" stroke-width="2"/>
    <polygon points="0,25 45,50 45,100 0,75" fill="#1e1b4b" stroke="#f59e0b" stroke-width="2"/>
    <polygon points="45,50 90,25 90,75 45,100" fill="#c2410c" stroke="#f59e0b" stroke-width="2"/>
    <text x="28" y="32" font-size="16">🐂</text>
  </g>

  <!-- Gran Triángulo Mitológico de Mino Dice: Minotauro, Grifo y Sirena -->
  <g transform="translate(420, 90)" opacity="0.45">
    <!-- Alas Majestuosas del Grifo (Derecha) -->
    <path d="M 170,120 C 220,70 270,60 310,80 C 280,120 230,160 170,170 C 240,180 280,210 260,250 C 220,240 180,210 160,190 Z" fill="url(#minoBronze)"/>

    <!-- Olas y Cola Mística de la Sirena (Abajo) -->
    <path d="M 60,310 C 100,260 160,280 200,250 C 180,300 130,340 70,360 C 130,350 180,380 160,420 C 110,400 70,360 40,330 Z" fill="url(#minoTurquoise)"/>

    <!-- Silueta del Minotauro del Laberinto (Centro) -->
    <!-- Cuernos de Minotauro -->
    <path d="M 50,85 C 20,40 -15,20 -50,30 C -55,40 -35,65 10,95 C 30,110 40,118 50,125 Z" fill="url(#minoBronze)"/>
    <path d="M 140,85 C 170,40 205,20 240,30 C 245,40 225,65 180,95 C 160,110 150,118 140,125 Z" fill="url(#minoBronze)"/>

    <!-- Cabeza Imponente del Minotauro -->
    <path d="M 50,95 C 40,115 35,150 45,190 C 55,230 75,270 95,285 C 115,270 135,230 145,190 C 155,150 150,115 140,95 C 120,80 70,80 50,95 Z" fill="#0b1326" stroke="#06b6d4" stroke-width="2.5"/>

    <!-- Ojos de Furia del Laberinto -->
    <ellipse cx="70" cy="150" rx="12" ry="6" transform="rotate(-15, 70, 150)" fill="#f59e0b"/>
    <ellipse cx="120" cy="150" rx="12" ry="6" transform="rotate(15, 120, 150)" fill="#f59e0b"/>
    <circle cx="70" cy="150" r="3" fill="#ffffff"/>
    <circle cx="120" cy="150" r="3" fill="#ffffff"/>

    <!-- Hocico y Respiración -->
    <ellipse cx="95" cy="245" rx="30" ry="20" fill="#312e81" stroke="#06b6d4" stroke-width="1.5"/>
    <circle cx="85" cy="248" r="6" fill="#0b1326"/>
    <circle cx="105" cy="248" r="6" fill="#0b1326"/>
    <!-- Aro de Bronce del Minotauro -->
    <path d="M 90,256 C 90,274 100,274 100,256" stroke="#f59e0b" stroke-width="3" fill="none"/>

    <!-- Iconos del Triángulo Mitológico Rodeando al Minotauro -->
    <g transform="translate(-10, 180)">
      <circle cx="0" cy="0" r="22" fill="#1e1b4b" stroke="#f59e0b" stroke-width="2"/>
      <text x="-12" y="7" font-size="20">🦅</text>
    </g>
    <g transform="translate(195, 230)">
      <circle cx="0" cy="0" r="22" fill="#1e1b4b" stroke="#06b6d4" stroke-width="2"/>
      <text x="-12" y="7" font-size="20">🧜‍♀️</text>
    </g>
  </g>
</svg>
