<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Gradiente de Atmósfera Náutica Skull King -->
    <radialGradient id="skGlow" cx="65%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.38"/>
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.22"/>
      <stop offset="75%" stop-color="#1e3a8a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0b1326" stop-opacity="0"/>
    </radialGradient>

    <!-- Resplandor Dorado de la Luna Llena Pirata -->
    <radialGradient id="moonGlow" cx="60%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0b1326" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente de Oro Pulido para Timón y Corona -->
    <linearGradient id="goldHelm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Gradiente de Madera de Galeón -->
    <linearGradient id="galleonWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#451a03" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1c1917" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Gradiente de Hueso y Calavera -->
    <linearGradient id="skullBone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#fef3c7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <!-- Atmósfera General de Mar Nocturno -->
  <rect width="600" height="600" fill="url(#skGlow)"/>
  <circle cx="410" cy="230" r="230" fill="url(#moonGlow)"/>

  <!-- Cartografía y Rosa de los Vientos de Fondo -->
  <g opacity="0.22" stroke="#f59e0b" stroke-width="2" fill="none">
    <circle cx="410" cy="230" r="215" stroke-dasharray="16,8"/>
    <circle cx="410" cy="230" r="185"/>
    <circle cx="410" cy="230" r="145" stroke-dasharray="8,6"/>
    <circle cx="410" cy="230" r="110"/>
    <line x1="410" y1="15" x2="410" y2="445" stroke-dasharray="6,6"/>
    <line x1="195" y1="230" x2="625" y2="230" stroke-dasharray="6,6"/>
  </g>

  <!-- Timón Principal del Capitán Pirata (Ship's Wheel) -->
  <g transform="translate(410, 230)">
    <!-- Radios del Timón (8 Manijas Radiantes) -->
    <g stroke="url(#goldHelm)" stroke-width="6" stroke-linecap="round">
      <line x1="0" y1="-145" x2="0" y2="145"/>
      <line x1="-145" y1="0" x2="145" y2="0"/>
      <line x1="-102" y1="-102" x2="102" y2="102"/>
      <line x1="-102" y1="102" x2="102" y2="-102"/>
    </g>

    <!-- Empuñaduras Exteriores Torneadas -->
    <g fill="url(#goldHelm)" stroke="#fef08a" stroke-width="1.5">
      <circle cx="0" cy="-148" r="9"/>
      <circle cx="0" cy="148" r="9"/>
      <circle cx="-148" cy="0" r="9"/>
      <circle cx="148" cy="0" r="9"/>
      <circle cx="-105" cy="-105" r="9"/>
      <circle cx="105" cy="105" r="9"/>
      <circle cx="-105" cy="105" r="9"/>
      <circle cx="105" cy="-105" r="9"/>
    </g>

    <!-- Aro Exterior de Madera y Oro -->
    <circle cx="0" cy="0" r="115" fill="none" stroke="url(#galleonWood)" stroke-width="16" opacity="0.9"/>
    <circle cx="0" cy="0" r="123" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="107" fill="none" stroke="#f59e0b" stroke-width="2.5"/>

    <!-- Remaches Náuticos en el Aro Exterior -->
    <g fill="#fef08a">
      <circle cx="0" cy="-115" r="3"/>
      <circle cx="0" cy="115" r="3"/>
      <circle cx="-115" cy="0" r="3"/>
      <circle cx="115" cy="0" r="3"/>
      <circle cx="-81" cy="-81" r="3"/>
      <circle cx="81" cy="81" r="3"/>
      <circle cx="-81" cy="81" r="3"/>
      <circle cx="81" cy="-81" r="3"/>
    </g>

    <!-- Aro Interior Concéntrico -->
    <circle cx="0" cy="0" r="68" fill="none" stroke="url(#goldHelm)" stroke-width="5" opacity="0.85"/>

    <!-- Espadas Piratas Cruzadas (Cutlasses) detrás del Escudo -->
    <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
      <!-- Hoja 1 -->
      <path d="M -80,-80 Q -30,-30 80,80" fill="none" stroke="#e2e8f0" stroke-width="5"/>
      <path d="M -80,-80 L -70,-65" fill="none" stroke="#fbbf24" stroke-width="6"/>
      <!-- Hoja 2 -->
      <path d="M 80,-80 Q 30,-30 -80,80" fill="none" stroke="#e2e8f0" stroke-width="5"/>
      <path d="M 80,-80 L 70,-65" fill="none" stroke="#fbbf24" stroke-width="6"/>
    </g>

    <!-- Núcleo Central: Sello de la Calavera del Rey Pirata -->
    <circle cx="0" cy="0" r="50" fill="url(#galleonWood)" stroke="url(#goldHelm)" stroke-width="4"/>

    <!-- Calavera Pirata Grabada -->
    <path d="M -18,-15 C -18,-30 18,-30 18,-15 C 22,-5 20,10 12,16 L 10,24 L -10,24 L -12,16 C -20,10 -22,-5 -18,-15 Z" fill="url(#skullBone)" stroke="#78350f" stroke-width="1.5"/>
    
    <!-- Ojos y Nariz de la Calavera -->
    <circle cx="-7" cy="-10" r="4.5" fill="#0f172a"/>
    <circle cx="7" cy="-10" r="4.5" fill="#0f172a"/>
    <polygon points="0,-3 -3,3 3,3" fill="#0f172a"/>
    
    <!-- Dientes de la Calavera -->
    <line x1="-6" y1="18" x2="-6" y2="24" stroke="#78350f" stroke-width="1.5"/>
    <line x1="0" y1="18" x2="0" y2="24" stroke="#78350f" stroke-width="1.5"/>
    <line x1="6" y1="18" x2="6" y2="24" stroke="#78350f" stroke-width="1.5"/>

    <!-- Corona Dorada del Skull King -->
    <path d="M -16,-26 L -20,-38 L -9,-32 L 0,-42 L 9,-32 L 20,-38 L 16,-26 Z" fill="url(#goldHelm)" stroke="#fef08a" stroke-width="1.5"/>
    <circle cx="0" cy="-33" r="2.5" fill="#ef4444"/>
    <circle cx="-10" cy="-28" r="2" fill="#3b82f6"/>
    <circle cx="10" cy="-28" r="2" fill="#10b981"/>
  </g>

  <!-- Olas Oceánicas y Tentáculos del Kraken en Primer Plano -->
  <g opacity="0.35" stroke="#f59e0b" stroke-linecap="round" fill="none">
    <path d="M 120,490 C 220,440 320,530 430,460 C 490,420 540,460 590,430" stroke-width="3"/>
    <path d="M 160,530 C 260,480 360,570 470,500 C 520,470 560,500 600,470" stroke-width="2"/>
  </g>
</svg>
