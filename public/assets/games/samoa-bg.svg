<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Gradiente Tropical de Samoa (Laguna y Arrecife) -->
    <radialGradient id="samoaLagoon" cx="65%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.38"/>
      <stop offset="40%" stop-color="#0f766e" stop-opacity="0.25"/>
      <stop offset="75%" stop-color="#134e4a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0b1326" stop-opacity="0"/>
    </radialGradient>

    <!-- Resplandor Dorado de Sol Polinesio -->
    <radialGradient id="sunGlow" cx="60%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0b1326" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente para la Máscara Ceremonial de Madera -->
    <linearGradient id="tikiWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#b45309" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#78350f" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#451a03" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Gradientes de Plumas Exóticas Vivas -->
    <linearGradient id="featherTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#14b8a6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="featherCoral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#be123c" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="featherGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Atmósfera de la Laguna y la Playa -->
  <rect width="600" height="600" fill="url(#samoaLagoon)"/>
  <circle cx="410" cy="230" r="230" fill="url(#sunGlow)"/>

  <!-- Patrones Tribales Polinesios Circulares -->
  <g opacity="0.22" stroke="#14b8a6" stroke-width="2" fill="none">
    <circle cx="410" cy="230" r="215" stroke-dasharray="14,8"/>
    <circle cx="410" cy="230" r="185"/>
    <circle cx="410" cy="230" r="145" stroke-dasharray="8,6"/>
    <circle cx="410" cy="230" r="110"/>
    <!-- Olas del Pacífico -->
    <path d="M 180,450 Q 240,420 300,450 T 420,450 T 540,450 T 660,450" stroke-width="3"/>
    <path d="M 210,480 Q 270,450 330,480 T 450,480 T 570,480 T 690,480" stroke-width="2"/>
  </g>

  <!-- Corona de Plumas Ceremoniales -->
  <g stroke="#fef08a" stroke-width="2" opacity="0.92">
    <!-- Pluma Central (Dorada) -->
    <path d="M 410,135 C 398,80 404,30 410,10 C 416,30 422,80 410,135 Z" fill="url(#featherGold)"/>
    <path d="M 410,15 L 410,130" stroke="#f59e0b" stroke-width="2.5"/>

    <!-- Pluma Izquierda 1 (Turquesa) -->
    <path d="M 388,140 C 360,90 345,45 335,25 C 358,52 382,100 388,140 Z" fill="url(#featherTeal)"/>
    <path d="M 340,30 Q 368,88 388,140" stroke="#0d9488" stroke-width="2"/>

    <!-- Pluma Derecha 1 (Coral) -->
    <path d="M 432,140 C 460,90 475,45 485,25 C 462,52 438,100 432,140 Z" fill="url(#featherCoral)"/>
    <path d="M 480,30 Q 452,88 432,140" stroke="#e11d48" stroke-width="2"/>

    <!-- Pluma Izquierda Exterior (Rosa Coral) -->
    <path d="M 368,155 C 325,115 295,80 275,65 C 305,98 342,130 368,155 Z" fill="url(#featherCoral)"/>

    <!-- Pluma Derecha Exterior (Turquesa) -->
    <path d="M 452,155 C 495,115 525,80 545,65 C 515,98 478,130 452,155 Z" fill="url(#featherTeal)"/>
  </g>

  <!-- Máscara Ceremonial Tiki (Talla de Madera de Samoa en 410, 275) -->
  <g transform="translate(410, 275)" opacity="0.95">
    <!-- Contorno de la Máscara de Madera Tallada -->
    <path d="M -80,-135 C -95,-75 -90,45 -70,145 C -30,170 30,170 70,145 C 90,45 95,-75 80,-135 C 50,-150 -50,-150 -80,-135 Z"
          fill="url(#tikiWood)" stroke="#fde047" stroke-width="3.5"/>

    <!-- Tocado Superior / Grabados de la Frente -->
    <g stroke="#fde047" stroke-width="2.5" fill="none">
      <path d="M -60,-120 L 0,-140 L 60,-120"/>
      <path d="M -50,-105 L 0,-125 L 50,-105"/>
      <circle cx="-30" cy="-110" r="5" fill="#fbbf24"/>
      <circle cx="0" cy="-117" r="6" fill="#f59e0b"/>
      <circle cx="30" cy="-110" r="5" fill="#fbbf24"/>
    </g>

    <!-- Ojos de Tiki (Místicos y Geométricos Neón) -->
    <g fill="#0b1326" stroke="#2dd4bf" stroke-width="3">
      <!-- Ojo Izquierdo -->
      <path d="M -65,-70 Q -35,-90 -10,-70 Q -35,-50 -65,-70 Z"/>
      <circle cx="-37" cy="-70" r="8" fill="#2dd4bf"/>
      <circle cx="-37" cy="-70" r="3.5" fill="#ffffff"/>

      <!-- Ojo Derecho -->
      <path d="M 10,-70 Q 35,-90 65,-70 Q 35,-50 10,-70 Z"/>
      <circle cx="37" cy="-70" r="8" fill="#2dd4bf"/>
      <circle cx="37" cy="-70" r="3.5" fill="#ffffff"/>
    </g>

    <!-- Nariz Tallada -->
    <path d="M -15,-60 L -10,5 L -25,15 L 0,23 L 25,15 L 10,5 L 15,-60 Z"
          fill="#b45309" stroke="#fde047" stroke-width="2.5"/>

    <!-- Boca Ceremonial Tatuada (Tiki Smile / Dientes Tallados) -->
    <path d="M -55,50 Q 0,40 55,50 Q 45,100 0,105 Q -45,100 -55,50 Z"
          fill="#1e1b4b" stroke="#fde047" stroke-width="3"/>

    <!-- Dientes de la Máscara -->
    <g stroke="#ffffff" stroke-width="2" fill="#ffffff">
      <rect x="-35" y="52" width="10" height="18" rx="2"/>
      <rect x="-18" y="53" width="10" height="20" rx="2"/>
      <rect x="-1" y="53" width="10" height="20" rx="2"/>
      <rect x="16" y="53" width="10" height="20" rx="2"/>
      <rect x="33" y="52" width="10" height="18" rx="2"/>

      <rect x="-28" y="79" width="9" height="16" rx="2"/>
      <rect x="-11" y="80" width="9" height="17" rx="2"/>
      <rect x="6" y="80" width="9" height="17" rx="2"/>
      <rect x="23" y="79" width="9" height="16" rx="2"/>
    </g>

    <!-- Tatuajes Faciales Tribales (Mejillas y Mentón) -->
    <g stroke="#2dd4bf" stroke-width="2.5" fill="none">
      <path d="M -65,-20 Q -45,-30 -40,-5 T -50,20"/>
      <path d="M 65,-20 Q 45,-30 40,-5 T 50,20"/>
      <!-- Mentón -->
      <path d="M -30,125 L 0,140 L 30,125"/>
      <path d="M -20,135 L 0,147 L 20,135"/>
    </g>
  </g>
</svg>
